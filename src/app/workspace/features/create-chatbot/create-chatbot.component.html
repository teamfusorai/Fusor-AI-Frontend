<div class="wizard-container">

  <!-- STICKY HEADER -->
  <header class="wizard-sticky-header">
    <!-- Top Bar -->
    <div class="max-w-5xl mx-auto px-3 md:px-4 pt-5 pb-2">
      <div style="padding-left: 4%;">
        <h3 class="m-0 text-2xl md:text-3xl font-semibold text-color">Create New Chatbot</h3>
        <p class="m-0 text-sm md:text-base text-color-secondary mt-1">Step {{ currentStepIndex + 1 }} of {{ items.length }}</p>
      </div>
    </div>

    <!-- CUSTOM STEPPER -->
    <div class="w-full">
      <div class="stepper-wrapper max-w-5xl mx-auto mt-2 px-3 md:px-4 pb-4">
        <div style="position: absolute; top: 20px; left: 10%; width: 80%; height: 3px; z-index: 1;">
          <div class="stepper-track-bg" style="position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #E5E5E5;"></div>
          <div class="stepper-track-fill" [style.width.%]="getProgressWidth()" style="position: absolute; top: 0; left: 0; height: 3px; background: #000000; transition: width 0.3s ease;"></div>
        </div>

        <div class="stepper-nodes">
          <div *ngFor="let item of items; let i = index" class="stepper-node-item">
            <div class="node-circle" [ngClass]="{'active': i <= currentStepIndex}">
              {{ i + 1 }}
            </div>
            <div class="node-label mt-2" [ngClass]="{'active-text': i <= currentStepIndex}">
              <div class="label-text">{{ item.label }}</div>
              <div class="sub-text" *ngIf="item.title">{{ item.title }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- NATURAL FLOW MAIN CONTENT -->
  <main class="wizard-main-content flex justify-content-center p-3 md:p-6"
    style="background-color: #FAFAFA !important;">
    <div class="content-wrapper w-full max-w-4xl">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- FOOTER NAVIGATION -->
  <footer class="wizard-natural-footer px-3 md:px-6 py-4 flex justify-content-between align-items-center">
    <button class="nav-btn prev-btn" [disabled]="currentStepIndex === 0" (click)="goToPreviousStep()">
      <i class="pi pi-chevron-left mr-2"></i> Previous
    </button>

    <button class="nav-btn next-btn" [disabled]="!isNextValid || isNextLoading || (isUploading$ | async)"
      (click)="goToNextStep()">
      <span *ngIf="isNextLoading" class="pi pi-spinner pi-spin mr-2"></span>
      <ng-container *ngIf="currentStepIndex !== 4">
        Next <i *ngIf="!isNextLoading" class="pi pi-chevron-right ml-2"></i>
      </ng-container>
      <ng-container *ngIf="currentStepIndex === 4">
        {{ isPublished ? 'Go to Dashboard' : (isNextLoading ? 'Deploying...' : 'Publish Chatbot') }}
        <i *ngIf="!isNextLoading && !isPublished" class="pi pi-check ml-2"></i>
      </ng-container>
    </button>
  </footer>
</div>
