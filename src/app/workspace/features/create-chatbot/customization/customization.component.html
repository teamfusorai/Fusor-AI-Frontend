<div class="step-container">
  <div class="step-header">
    <h3>Customization</h3>
    <p>Personalize the look and feel of your chatbot widget.</p>
  </div>

  <form [formGroup]="customizationForm" class="step-form">
    
    <div class="color-picker-group">
      <label>Primary Brand Color</label>
      <div class="color-control">
        <p-colorPicker formControlName="primaryColor"></p-colorPicker>
        <span class="color-hex">{{ customizationForm.get('primaryColor')?.value }}</span>
      </div>
    </div>

    <div class="upload-group">
      <label>Chatbot Logo</label>
      <p-fileUpload 
        mode="basic" 
        chooseLabel="Upload Image" 
        accept="image/*" 
        [maxFileSize]="1000000" 
        (onSelect)="onLogoUpload($event)"
        [auto]="true">
      </p-fileUpload>
      <small>Recommended size: 100x100px. Max 1MB.</small>
    </div>

    <!-- For textarea, we don't have fusor-textarea yet, we'll use standard prime input with our CSS variables -->
    <div class="textarea-group">
      <label>Welcome Message</label>
      <textarea 
        pInputTextarea
        rows="4" 
        formControlName="welcomeMessage" 
        placeholder="E.g., Hello! How can I help you today?">
      </textarea>
    </div>

  </form>
</div>
