<div class="publish-wrapper max-w-5xl mx-auto w-full" *ngIf="mappedData$ | async as data">
  <app-fusor-card>
    <div card-body class="p-4 md:p-5">
      <!-- Figma Design Header -->
      <div class="flex flex-column align-items-center mb-5 text-center">
        <div class="flex align-items-center justify-content-center bg-black-alpha-90 border-round-2xl mb-4 w-4rem h-4rem">
          <img src="assets/Media/rocketIcon.svg" alt="Rocket Icon" class="w-2rem h-2rem filter-invert" />
        </div>
        <h2 class="m-0 mb-2 font-semibold text-900 text-3xl">Deploy Your Chatbot</h2>
        <p class="m-0 font-normal text-600 text-base">Choose how you'd like to integrate and deploy your chatbot</p>
      </div>

      <app-fusor-deployment-options mode="builder" [data]="data" [isLoading]="false"></app-fusor-deployment-options>
    </div>
  </app-fusor-card>
</div>
