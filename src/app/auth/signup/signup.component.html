<div class="auth-page-wrapper">
  <div class="auth-card">

    <a routerLink="/" class="close-btn" aria-label="Close">
      <i class="pi pi-times"></i>
    </a>

    <!-- Header -->
    <div class="dialog-header">
      <div class="logo-wrapper">
        <div class="icon-container">
          <img src="assets/Media/fusorai-logo.png" alt="Fusor AI Logo" style="width: 24px; height: 24px; object-fit: contain;">
        </div>
        <span class="logo-text">Fusor AI</span>
      </div>
      <h2>Create an account</h2>
      <p>Sign up to start building AI chatbots</p>
    </div>

    <!-- Error Display -->
    <div class="global-error" *ngIf="errorMsg">
      <i class="pi pi-exclamation-circle"></i>
      {{ errorMsg }}
    </div>

    <!-- Sign up Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="auth-form">

      <!-- Name -->
      <app-fusor-input label="Full Name" type="text" placeholder="John Doe" formControlName="name"
        [errorMessage]="f['name'].invalid && f['name'].touched ? 'Please enter your full name' : ''">
      </app-fusor-input>

      <!-- Email -->
      <app-fusor-input label="Email" type="email" placeholder="name@company.com" formControlName="email"
        [errorMessage]="f['email'].invalid && f['email'].touched ? 'Please enter a valid email address' : ''">
      </app-fusor-input>

      <!-- Password -->
      <app-fusor-input label="Password" type="password" placeholder="Create a password" formControlName="password"
        [errorMessage]="f['password'].invalid && f['password'].touched ? 'Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special character' : ''">
      </app-fusor-input>

      <!-- Confirm Password -->
      <app-fusor-input label="Confirm Password" type="password" placeholder="Confirm your password" formControlName="confirmPassword"
        [errorMessage]="(f['confirmPassword'].touched || signupForm.touched) && signupForm.hasError('mismatch') ? 'Passwords do not match' : ''">
      </app-fusor-input>

      <!-- Submit Button -->
      <app-fusor-button type="submit" label="Sign up" [loading]="(authLoader.isLoading$ | async) ?? false">
      </app-fusor-button>
    </form>

    <div class="divider">
      <span>Or continue with</span>
    </div>

    <!-- Social Logins -->
    <div class="social-logins">
      <app-fusor-button variant="outline" icon="pi pi-google" label="Google"></app-fusor-button>
      <app-fusor-button variant="outline" icon="pi pi-github" label="GitHub"></app-fusor-button>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/auth" class="login-link">Login</a>
    </div>

  </div>
</div>
