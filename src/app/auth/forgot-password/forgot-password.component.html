<div class="auth-page-wrapper">
  <div class="auth-card">

    <a routerLink="/" class="close-btn" aria-label="Close">
      <i class="pi pi-times"></i>
    </a>

    <!-- Header -->
    <div class="dialog-header">
      <div class="logo-wrapper">
        <div class="icon-container">
          <!-- Logo for Fusor AI -->
          <img src="assets/Media/fusorai-logo.png" alt="Fusor AI Logo"
            class="w-2rem h-2rem object-contain">
        </div>
        <span class="logo-text">Fusor AI</span>
      </div>
      <h2>Reset your password</h2>
      <p>Enter your email address and we'll send you a link to reset your password</p>
    </div>

    <!-- Feedback Messages -->
    <div class="global-error" *ngIf="errorMsg">
      <i class="pi pi-exclamation-circle"></i>
      {{ errorMsg }}
    </div>

    <div class="global-success" *ngIf="successMsg">
      <i class="pi pi-check-circle"></i>
      {{ successMsg }}
    </div>

    <!-- Form -->
    <form *ngIf="!successMsg" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">

      <!-- Email -->
      <app-fusor-input label="Email" type="email" placeholder="name@company.com" formControlName="email"
        [errorMessage]="f['email'].invalid && f['email'].touched ? 'Please enter a valid email address' : ''">
      </app-fusor-input>

      <!-- Submit Button -->
      <app-fusor-button type="submit" label="Send Reset Link" [fullWidth]="true"
        [loading]="(authLoader.isLoading$ | async) ?? false">
      </app-fusor-button>
    </form>

    <div class="auth-footer mt-4" *ngIf="successMsg">
      <a routerLink="/" class="no-underline">
        <app-fusor-button variant="outline" label="Back to Login"></app-fusor-button>
      </a>
    </div>

  </div>
</div>
